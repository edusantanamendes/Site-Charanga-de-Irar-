services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: charanga
      POSTGRES_DB: charanga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no ambiente}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charanga -d charanga"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL para o serviço db}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  uploads:
